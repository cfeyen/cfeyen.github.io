<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sound Change Applier</title>
    <link rel="icon" href="icons/cscsca.png">
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <h1>CSCSCA</h1>
    <div class="main">
        <input id="cscsca-input" type="text" value="pata takan"/>
        <br>
        <textarea id="cscsca-rules">
DEFINE V {i, e, a, u, o}
DEFINE N {m, n}
DEFINE P- {p, t, k}
DEFINE P+ {b, d, g}

@P- >> @P+ / @V _ @V

{@V, @N} >> / @V [*] _ #
</textarea>
        <button id="cscsca-apply">Apply</button>
        <br>
        <div id="cscsca-logs"></div>
        <p id="cscsca-output"></p>
    </div>

    <script type="text/javascript" src="script.js"></script>
    <script type="module">
      import init, { apply_rules } from "./pkg/cscsca.js";

      init().then(() => {
        document.getElementById("cscsca-apply").onclick = () => {
          let logs = document.getElementById("cscsca-logs");
          logs.innerHTML = "";

          let input = document.getElementById("cscsca-input").value;
          let rules = document.getElementById("cscsca-rules").value;

          let result = apply_rules(input, rules);

          document.getElementById("cscsca-output").innerText = result;
        };
      });
    </script>
  </body>
</html>
